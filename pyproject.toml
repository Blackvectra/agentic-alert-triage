[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "Trustworthy Agentic AI for Security Alert Triage (EE 672 semester project)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff==0.17.6", "nbclient>=0.10", "ipykernel>=6.29", "nbformat>=5.10"]
notebook = ["jupyterlab>=4.2", "pandas>=2.2", "matplotlib>=3.8", "plotly>=5.20"]
report = ["pandas>=2.2", "matplotlib>=3.8", "plotly>=5.20"]
# Optional paid model; the experiment itself uses a free local model via Ollama (ADR 0004).
anthropic = ["anthropic>=2.0"]

[tool.setuptools]
# Only triage/ is code; fixtures/, runs/ and notebooks/ are data.
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Small on purpose: catch leftovers (unused imports and names, undefined names) and keep
# imports sorted. Pinned in [dev] so a ruff upgrade can't turn CI red on its own.
lint.select = ["F", "I"]
