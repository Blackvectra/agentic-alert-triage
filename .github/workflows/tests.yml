name: tests
# Pull requests are tested by the pull_request event; pushes are tested only on main.
# (Testing every push too ran each PR commit twice.)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Same command as locally: fresh venv, install, every test (incl. the notebook).
      # Tests use fake clients only: no API key, no network calls to model providers.
      - run: python scripts/check.py
